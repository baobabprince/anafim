name: Restore App.jsx
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/restore-app-jsx.yml'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App.jsx from last good commit
        run: |
          set -euo pipefail
          SIZE=$(wc -c < family-viewer/src/App.jsx || echo 0)
          echo "Current App.jsx size: $SIZE"
          if [ "$SIZE" -gt 10000 ]; then
            echo "App.jsx already looks restored; skipping"
            exit 0
          fi
          git checkout 0ef665cf -- family-viewer/src/App.jsx
          sed -i 's/isModalOpen={!!modal||mobileMenu}/isModalOpen={!!modal}/g' family-viewer/src/App.jsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/App.jsx
          git commit -m "fix: restore full App.jsx after accidental truncation"
          git push
