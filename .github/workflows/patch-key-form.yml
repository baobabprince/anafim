name: Patch key input form
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/patch_key_input_form.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/EditPersonAiModal.jsx
          git diff --staged --quiet && exit 0
          git commit -m "fix(ui): put Gemini API key field inside a form (DOM warning)"
          git push
