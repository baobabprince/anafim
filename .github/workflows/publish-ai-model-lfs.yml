name: Publish AI model (Git LFS)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-ai-model-lfs
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Git LFS
        run: |
          git lfs install --local
          git lfs track "models/**"
          git lfs track "*.onnx"
          cat .gitattributes

      - name: Download SmolLM2-135M instruct (q4f16)
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
        run: |
          set -euo pipefail
          python3 -m pip install -q "huggingface_hub[hf_transfer]"
          rm -rf models/smollm2-360m
          mkdir -p models/smollm2-360m/onnx
          python3 << 'PY'
          from huggingface_hub import hf_hub_download
          from pathlib import Path
          import shutil

          dest = Path("models/smollm2-360m")
          dest.mkdir(parents=True, exist_ok=True)
          (dest / "onnx").mkdir(exist_ok=True)

          repo = "HuggingFaceTB/SmolLM2-135M-Instruct"
          text_files = [
              "config.json",
              "generation_config.json",
              "tokenizer.json",
              "tokenizer_config.json",
              "special_tokens_map.json",
              "vocab.json",
              "merges.txt",
          ]
          for name in text_files:
              path = hf_hub_download(repo_id=repo, filename=name)
              shutil.copy2(path, dest / name)
              print("ok", name, (dest / name).stat().st_size)

          for onnx_name in ("onnx/model_q4f16.onnx", "onnx/model_q4.onnx"):
              try:
                  path = hf_hub_download(repo_id=repo, filename=onnx_name)
                  out = dest / "onnx" / Path(onnx_name).name
                  shutil.copy2(path, out)
                  print("onnx", out, out.stat().st_size)
                  break
              except Exception as e:
                  print("onnx miss", onnx_name, e)
          else:
              raise SystemExit("no onnx weight downloaded")
          PY
          du -sh models/smollm2-360m
          find models/smollm2-360m -type f -printf '%s\t%p\n' | sort -n

      - name: Commit and push with LFS
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .gitattributes models
          git status
          git lfs status || true
          git lfs ls-files || true
          if git diff --staged --quiet; then
            echo "No model changes"
            exit 0
          fi
          git commit -m "feat(ai): store full SmolLM2 model tree in Git LFS"
          # Push LFS objects for the current branch, then git refs
          git lfs push origin "$(git rev-parse --abbrev-ref HEAD)"
          git push origin HEAD:master

      - name: Verify media URL serves binary ONNX (not LFS pointer)
        run: |
          set -euo pipefail
          sleep 8
          URL="https://media.githubusercontent.com/media/baobabprince/anafim/master/models/smollm2-360m/onnx/model_q4f16.onnx"
          echo "Checking $URL"
          if curl -sL "$URL" | head -c 40 | grep -q "version https://git-lfs"; then
            echo "ERROR: still receiving LFS pointer text"
            curl -sI "$URL" | head -20
            exit 1
          fi
          SIZE=$(curl -sIL "$URL" | grep -i content-length | tail -1)
          echo "OK (not an LFS pointer). $SIZE"
