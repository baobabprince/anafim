name: Apply deep-link support

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-deeplink.yml'
      - 'family-viewer/scripts/apply-deeplink.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 family-viewer/scripts/apply-deeplink.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/App.jsx
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "feat(deeplink): open person from ?q= or ?id= URL params"
          git push origin HEAD:master
