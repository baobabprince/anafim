name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    paths-ignore:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-viewer/package-lock.json

      - name: Install dependencies
        working-directory: family-viewer
        run: npm ci

      - name: Download self-hosted ONNX model (for local AI fallback)
        env:
          HF_HUB_ENABLE_HF_TRANSFER: "1"
        run: |
          set -euo pipefail
          python3 -m pip install -q "huggingface_hub[hf_transfer]"
          DEST="family-viewer/public/models/smollm2-360m"
          mkdir -p "$DEST"
          python3 << 'PY'
          from huggingface_hub import snapshot_download
          from pathlib import Path

          dest = Path("family-viewer/public/models/smollm2-360m")
          dest.mkdir(parents=True, exist_ok=True)

          repo = "HuggingFaceTB/SmolLM2-360M-Instruct"
          allow = [
              "config.json",
              "generation_config.json",
              "tokenizer.json",
              "tokenizer_config.json",
              "special_tokens_map.json",
              "vocab.json",
              "merges.txt",
              "onnx/model_q4f16.onnx",
              "onnx/model_q4.onnx",
              "onnx/model_quantized.onnx",
          ]
          print(f"Downloading subset from {repo} → {dest}")
          cached = snapshot_download(
              repo_id=repo,
              allow_patterns=allow,
              local_dir=str(dest),
          )
          print("Downloaded to", cached)
          for p in sorted(dest.rglob("*")):
              if p.is_file():
                  print(f"  {p.relative_to(dest)}  ({p.stat().st_size // 1024} KB)")
          if not (dest / "config.json").exists():
              raise SystemExit("config.json missing after download")
          onnx_dir = dest / "onnx"
          if not onnx_dir.exists() or not any(onnx_dir.glob("*.onnx")):
              raise SystemExit("No ONNX weights under onnx/")
          PY
          echo "Self-hosted model ready under $DEST"

      - name: Build with public Supabase config
        working-directory: family-viewer
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::Missing VITE_SUPABASE_URL or VITE_SUPABASE_PUBLISHABLE_KEY secret — cloud login will stay unconfigured for end users."
          else
            echo "Cloud config present (URL host: $(python3 -c 'import os; from urllib.parse import urlparse; print(urlparse(os.environ[\"VITE_SUPABASE_URL\"]).hostname or \"?\")'))"
          fi
          npm run build
          python3 << 'PY'
          import json, os, pathlib, re
          url = (os.environ.get("VITE_SUPABASE_URL") or "").strip()
          key = (os.environ.get("VITE_SUPABASE_PUBLISHABLE_KEY") or "").strip()
          if not url or not key:
              print("skip HTML inject: secrets not set")
              raise SystemExit(0)
          payload = json.dumps({"url": url, "key": key}, ensure_ascii=False)
          script = f'<script id="anafim-cloud-config" type="application/json">{payload}</script>'
          path = pathlib.Path("dist/index.html")
          if not path.exists():
              raise SystemExit("dist/index.html missing after build")
          html = path.read_text(encoding="utf-8")
          if 'id="anafim-cloud-config"' in html:
              html = re.sub(
                  r'<script id="anafim-cloud-config"[^>]*>[\s\S]*?</script>',
                  script,
                  html,
                  count=1,
              )
          else:
              html = html.replace('<div id="root"></div>', script + '\n    <div id="root"></div>', 1)
          path.write_text(html, encoding="utf-8")
          print("injected anafim-cloud-config into dist/index.html")
          PY

      - name: Prepare docs folder
        run: |
          rm -rf docs
          mkdir -p docs
          cp -a family-viewer/dist/. docs/
          touch docs/.nojekyll

      - name: Commit and push docs on master
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master || true
          git add docs
          if git diff --staged --quiet; then
            echo "No changes in docs"
          else
            git commit -m "chore: update docs site build"
            git push origin HEAD:master || (git pull --rebase origin master && git push origin HEAD:master)
          fi

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./family-viewer/dist
          force_orphan: true
