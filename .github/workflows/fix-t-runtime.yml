name: Fix t runtime errors
on:
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Fix sources
        run: |
          python3 << 'PY'
          from pathlib import Path

          fx = Path('family-viewer/src/FamilyExperience.jsx')
          src = fx.read_text(encoding='utf-8')
          bad = "{t('fx.with', { name: event.partners.map(p=>p.name).join(', ')}</span>"
          good = "{t('fx.with', { name: event.partners.map(p => p.name).join(', ') })}</span>"
          if bad in src:
              src = src.replace(bad, good)
              fx.write_text(src, encoding='utf-8')
              print('FX fixed partners line')
          elif good in src:
              print('FX already good')
          else:
              # fallback: insert missing )}
              alt = "join(', ')}</span>"
              if alt in src and "join(', ') })}</span>" not in src:
                  src = src.replace(alt, "join(', ') })}</span>", 1)
                  fx.write_text(src, encoding='utf-8')
                  print('FX fixed via alt')
              else:
                  print('FX pattern not found')

          app_path = Path('family-viewer/src/App.jsx')
          app = app_path.read_text(encoding='utf-8')
          changed = False
          for sig in [
              'function Dialog(',
              'function SearchBar(',
              'function FileView(',
              'function ToolsDialog(',
              'function PeopleView(',
              'function UploadDialog(',
              'function SidebarToolsMenu(',
          ]:
              idx = app.find(sig)
              if idx < 0:
                  print('no', sig)
                  continue
              brace = app.find('{', idx)
              region = app[brace:brace+80]
              if 'useI18n' in region:
                  print('ok', sig)
                  continue
              app = app[:brace+1] + "\n  const { t } = useI18n();" + app[brace+1:]
              changed = True
              print('added', sig)
          if changed:
              app_path.write_text(app, encoding='utf-8')
              print('App saved')
          else:
              print('App unchanged')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/FamilyExperience.jsx family-viewer/src/App.jsx
          if git diff --staged --quiet; then echo no change; else
            git commit -m "fix: FamilyExperience syntax + useI18n hooks in App"
            git push origin master
          fi
