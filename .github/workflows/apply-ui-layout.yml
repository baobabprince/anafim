name: Apply UI layout tweaks
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: python3 scripts/patch_ui_layout.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/gedcom.js family-viewer/src/FamilyExperience.jsx family-viewer/src/App.jsx family-viewer/src/family.css family-viewer/src/styles.css
          git status
          git commit -m "Cloud in sidebar, remove focus ribbon text, horizontal family lists, Hebrew date only on focus card" || exit 0
          git push
