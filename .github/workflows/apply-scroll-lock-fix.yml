name: apply-scroll-lock-fix
on:
  workflow_dispatch:
  push:
    branches: [fix/mobile-scroll-lock]
    paths:
      - scripts/apply-scroll-lock.py
      - family-viewer/src/scroll-lock.js
      - .github/workflows/apply-scroll-lock-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mobile-scroll-lock
          fetch-depth: 0
      - name: Restore App.jsx from master if corrupted
        run: |
          size=$(wc -c < family-viewer/src/App.jsx || echo 0)
          if [ "$size" -lt 1000 ]; then
            echo "Restoring App.jsx from master (was $size bytes)"
            git checkout origin/master -- family-viewer/src/App.jsx
          fi
          git checkout origin/master -- family-viewer/src/FamilyExperience.jsx || true
      - name: Apply scroll-lock patches
        run: python3 scripts/apply-scroll-lock.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/App.jsx family-viewer/src/FamilyExperience.jsx family-viewer/src/scroll-lock.js scripts/apply-scroll-lock.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(mobile): apply ref-counted body scroll lock after import"
          git push origin fix/mobile-scroll-lock
