name: Quiet cloud UI
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/quiet_cloud_ui.py
      - .github/workflows/quiet-cloud-ui.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/quiet_cloud_ui.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/CloudAccess.jsx family-viewer/src/App.jsx family-viewer/src/styles.css
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "ui(cloud): quieter secondary sync entry and shorter copy"
          git push origin HEAD:master
