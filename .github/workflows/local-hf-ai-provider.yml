name: Local HF AI provider
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/add_local_hf_ai_provider.py
      - name: Install deps
        working-directory: family-viewer
        run: |
          npm ci
          npm install @huggingface/transformers@^3.5.0 --save
          node -e "import('./src/local-ai-provider.js').then(m => console.log('ok', Object.keys(m))).catch(e => { console.error(e); process.exit(1); })"
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/package.json family-viewer/package-lock.json family-viewer/src/local-ai-provider.js family-viewer/src/ai-service.js
          git status
          git commit -m "feat(ai): add local Hugging Face Qwen2.5-0.5B provider as fallback" || exit 0
          git push
