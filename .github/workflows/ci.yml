name: CI

on:
  push:
    branches: [master]
    paths:
      - 'family-viewer/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'family-viewer/**'
      - '.github/workflows/ci.yml'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: family-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: family-viewer/package-lock.json

      - name: Install dependencies
        env:
          npm_config_onnxruntime_node_install_cuda: skip
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          npm ci --onnxruntime-node-install-cuda=skip || npm ci --ignore-scripts
          if [ -f node_modules/onnxruntime-node/script/install.js ]; then
            node -e "process.env.npm_config_onnxruntime_node_install_cuda='skip'; require('./node_modules/onnxruntime-node/script/install.js')" || true
          fi

      - name: Run unit tests
        run: npm test

      # Live API coverage for free-text family-member addition. The key comes
      # from the OPENROUTER_API_KEY repository secret; without it these tests
      # skip. Non-blocking: free-model API flakiness must not fail CI.
      - name: Run live OpenRouter AI tests (family addition)
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node --test tests/openrouter-live.test.js

      - name: Build production bundle
        run: npm run build
