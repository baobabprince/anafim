name: Add source field to AI editor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/add_source_field_to_ai_editor.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/ai-service.js family-viewer/src/gedcom-ai-editor.js
          git status
          git commit -m "feat(ai): add source (מקור) field to person AI editor" || exit 0
          git push
