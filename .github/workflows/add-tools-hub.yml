name: Add tools hub

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-tools-hub.yml'
      - 'family-viewer/scripts/add-tools-hub.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: python3 family-viewer/scripts/add-tools-hub.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/App.jsx
          git status
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "feat(tools): advanced analysis hub — open genea-net, map, diff, GedShield"
          git push origin HEAD:master
