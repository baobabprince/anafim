name: Remove forget link

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/remove-forget-link.yml'
      - 'family-viewer/scripts/remove-forget-link.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 family-viewer/scripts/remove-forget-link.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "ui(file): remove delete-saved-copy line from privacy card"
          git push origin HEAD:master
