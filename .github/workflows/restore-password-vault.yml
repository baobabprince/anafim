name: Restore password vault sources
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/restore_and_password_vault.py
      - .github/workflows/restore-password-vault.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/restore_and_password_vault.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/vault-crypto.js family-viewer/src/CloudAccess.jsx
          git diff --cached --quiet && echo no-changes && exit 0
          git commit -m "feat(vault): Google + vault password E2EE; Passkey optional"
          git push origin HEAD:master
