name: Add tools button

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/add-tools-button.yml'
      - 'family-viewer/scripts/add-tools-button.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 family-viewer/scripts/add-tools-button.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(tools): entry button on file view for advanced hub"
          git push origin HEAD:master
