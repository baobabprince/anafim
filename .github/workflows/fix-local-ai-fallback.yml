name: Fix local AI WASM fallback
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/fix_local_ai_wasm_fallback.py
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add family-viewer/src/local-ai-provider.js
          git status
          git commit -m "fix(ai): fall back to WASM when WebGPU adapter is unavailable" || exit 0
          git push
